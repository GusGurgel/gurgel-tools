<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Templates | Gurgel Tools</title>
    <link rel="stylesheet" href="css/pico.min.css" />
    <style>
        .template-card {
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 1rem;
        }
        .template-card:hover {
            border-color: var(--pico-primary);
            background-color: var(--pico-card-sectioning-background-color);
        }
        .template-card.active {
            border-color: var(--pico-primary);
            box-shadow: 0 0 0 1px var(--pico-primary);
        }
        .template-card h4 { margin-bottom: 0.25rem; }
        .template-card p { margin-bottom: 0; font-size: 0.875rem; color: var(--pico-muted-color); }

        #detail-view { position: sticky; top: 1rem; }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-2 { gap: 0.5rem; display: flex; }

        /* Textarea specific for generated variables */
        textarea.var-input { resize: vertical; min-height: 80px; }

        /* Preview Container Classes */
        .preview-box {
            background: var(--pico-card-sectioning-background-color);
            padding: 1rem;
            border-radius: var(--pico-border-radius);
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        .preview-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 10;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: pre-wrap; /* Mantém quebras de linha do template */
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 0;
            color: var(--pico-color);
        }
        .preview-expanded {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 0;
            color: var(--pico-color);
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- Header -->
        <nav>
            <ul>
                <li><strong><i data-lucide="library"></i> Prompt Templates</strong></li>
            </ul>
            <ul>
                <li>
                    <button onclick="showCreateForm()" class="outline">
                        <i data-lucide="plus"></i> New Template
                    </button>
                </li>
            </ul>
        </nav>

        <div class="grid">
            <!-- Left Column: Search & List -->
            <div id="list-container">
                <!-- Caixa de Pesquisa -->
                <input type="search" id="search-input" placeholder="Search templates..." oninput="renderList()" style="margin-bottom: 1rem;" />

                <div id="template-list"></div>
                <p id="empty-state" class="hidden">No templates found.</p>
            </div>

            <!-- Right Column: Detail / Edit / Action -->
            <div id="detail-container">
                <!-- Idle State -->
                <article id="detail-idle">
                    <p class="text-center" style="color: var(--pico-muted-color);">Select a template from the list to view and use.</p>
                </article>

                <!-- Action View -->
                <article id="detail-view" class="hidden">
                    <header class="flex-between">
                        <h3 id="view-name" style="margin: 0;"></h3>
                        <div class="gap-2">
                            <button onclick="showEditForm()" class="secondary outline" aria-label="Edit">
                                <i data-lucide="pencil"></i>
                            </button>
                            <button onclick="deleteTemplate()" class="secondary outline" aria-label="Delete" style="color: var(--pico-del-color); border-color: var(--pico-del-color);">
                                <i data-lucide="trash-2"></i>
                            </button>
                        </div>
                    </header>
                    <p id="view-description" style="color: var(--pico-muted-color); margin-bottom: 0;"></p>

                    <!-- Content Preview (Limitado a 10 linhas com botão expandir) -->
                    <div class="preview-box">
                        <strong style="display: block; margin-bottom: 0.5rem; color: var(--pico-muted-color); font-size: 0.875rem;">Template Content</strong>
                        <div id="content-preview-text" class="preview-collapsed"></div>
                        <button id="toggle-preview-btn" class="secondary outline" style="margin-top: 0.75rem; width: 100%; display: none;" onclick="togglePreview()">
                            <i data-lucide="chevron-down"></i> Expand
                        </button>
                    </div>

                    <hr/>

                    <!-- Dynamic form based on Variables -->
                    <div id="variables-container"></div>

                    <footer>
                        <button onclick="copyToClipboard()" class="primary">
                            <i data-lucide="copy"></i> Copy to Clipboard
                        </button>
                    </footer>
                </article>

                <!-- Edit / Create Form -->
                <article id="form-view" class="hidden">
                    <header><h3 id="form-title" style="margin: 0;">Create Template</h3></header>
                    <form id="template-form" onsubmit="handleFormSubmit(event)">
                        <input type="hidden" id="form-id">

                        <label for="form-name">Name</label>
                        <input type="text" id="form-name" required>

                        <label for="form-description">Description (optional)</label>
                        <input type="text" id="form-description">

                        <label for="form-content">
                            Content
                            <small>Use <code>[[Variable Name]]</code> to create dynamic fields.</small>
                        </label>
                        <textarea id="form-content" rows="8" required></textarea>

                        <footer class="flex-between">
                            <button type="button" class="secondary outline" onclick="cancelForm()">Cancel</button>
                            <button type="submit" class="primary"><i data-lucide="save"></i> Save</button>
                        </footer>
                    </form>
                </article>
            </div>
        </div>
    </main>

    <script src="static/lucide.js"></script>
    <script>
        let templates = [];
        let activeTemplate = null;
        let activeVariables = [];

        const escapeHTML = str => {
            if(!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchTemplates();
        });

        async function fetchTemplates(keepSelection = true) {
            try {
                const res = await fetch('/api/prompt-templates');
                templates = await res.json();
                renderList();

                if (keepSelection && activeTemplate) {
                    const stillExists = templates.find(t => t.id === activeTemplate.id);
                    if (stillExists) {
                        selectTemplate(stillExists.id, false);
                    } else {
                        cancelForm();
                    }
                }
            } catch (err) {
                console.error("Failed to fetch templates:", err);
            }
        }

        // List rendering agora possui filtragem baseada no input
        function renderList() {
            const listEl = document.getElementById('template-list');
            const emptyEl = document.getElementById('empty-state');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            listEl.innerHTML = '';

            // Filtra os templates como infixo ignorando a caixa
            const filteredTemplates = templates.filter(t =>
                t.name.toLowerCase().includes(searchTerm)
            );

            if (filteredTemplates.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');

            filteredTemplates.forEach(t => {
                const article = document.createElement('article');
                article.className = 'template-card';
                if (activeTemplate && activeTemplate.id === t.id) article.classList.add('active');

                article.onclick = () => selectTemplate(t.id);
                article.innerHTML = `
                    <h4>${escapeHTML(t.name)}</h4>
                    ${t.description ? `<p>${escapeHTML(t.description)}</p>` : ''}
                `;
                listEl.appendChild(article);
            });
            lucide.createIcons();
        }

        function selectTemplate(id, scroll = true) {
            activeTemplate = templates.find(t => t.id === id);
            renderList();

            document.getElementById('detail-idle').classList.add('hidden');
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');

            document.getElementById('view-name').innerText = activeTemplate.name;
            document.getElementById('view-description').innerText = activeTemplate.description || '';

            // Setup do Preview de Conteúdo
            setupContentPreview();

            buildVariablesForm();

            if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        // Lógica da caixa de preview (limite de 10 linhas e botão expandir)
        function setupContentPreview() {
            const previewText = document.getElementById('content-preview-text');
            const toggleBtn = document.getElementById('toggle-preview-btn');

            // Reseta a visualização
            previewText.className = 'preview-collapsed';
            previewText.textContent = activeTemplate.content; // textContent mantém segurança e quebras de linha
            toggleBtn.style.display = 'none';

            // Espera a renderização do DOM para calcular as alturas reais
            requestAnimationFrame(() => {
                // Se a altura que precisaria ter for maior do que a altura do limite (10 linhas), mostra o botão
                if (previewText.scrollHeight > previewText.clientHeight) {
                    toggleBtn.style.display = 'block';
                    toggleBtn.innerHTML = '<i data-lucide="chevron-down"></i> Expand';
                    lucide.createIcons();
                }
            });
        }

        function togglePreview() {
            const previewText = document.getElementById('content-preview-text');
            const toggleBtn = document.getElementById('toggle-preview-btn');

            if (previewText.classList.contains('preview-collapsed')) {
                previewText.classList.replace('preview-collapsed', 'preview-expanded');
                toggleBtn.innerHTML = '<i data-lucide="chevron-up"></i> Collapse';
            } else {
                previewText.classList.replace('preview-expanded', 'preview-collapsed');
                toggleBtn.innerHTML = '<i data-lucide="chevron-down"></i> Expand';
            }
            lucide.createIcons();
        }

        function buildVariablesForm() {
            const container = document.getElementById('variables-container');
            container.innerHTML = '';
            activeVariables = [];

            if (!activeTemplate.content) return;

            const regex = /\[\[(.*?)\]\]/g;
            const matches = [...activeTemplate.content.matchAll(regex)];
            const uniqueVars = [...new Set(matches.map(m => m[1]))];
            activeVariables = uniqueVars;

            if (uniqueVars.length === 0) {
                container.innerHTML = `<p style="color: var(--pico-muted-color);"><em>This template has no dynamic variables.</em></p>`;
                return;
            }

            uniqueVars.forEach(varName => {
                const label = document.createElement('label');
                label.innerText = varName;

                const textarea = document.createElement('textarea');
                textarea.className = 'var-input';
                textarea.id = `var-${btoa(varName).replace(/=/g, '')}`;
                textarea.placeholder = `Enter ${varName}...`;

                label.appendChild(textarea);
                container.appendChild(label);
            });
        }

        async function copyToClipboard() {
            if (!activeTemplate) return;

            let finalContent = activeTemplate.content;

            activeVariables.forEach(varName => {
                const safeId = `var-${btoa(varName).replace(/=/g, '')}`;
                const textarea = document.getElementById(safeId);
                const val = textarea.value || '';

                const replaceRegex = new RegExp(`\\[\\[${escapeRegExp(varName)}\\]\\]`, 'g');
                finalContent = finalContent.replace(replaceRegex, val);
            });

            try {
                await navigator.clipboard.writeText(finalContent);

                const btn = document.querySelector('#detail-view footer button');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check"></i> Copied!`;
                btn.classList.replace('primary', 'outline');
                lucide.createIcons();

                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.replace('outline', 'primary');
                    lucide.createIcons();
                }, 2000);

                await fetch(`/api/prompt-templates/${activeTemplate.id}/copied`, { method: 'PATCH' });
                await fetchTemplates(true);

            } catch (err) {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy text to clipboard.');
            }
        }

        function showCreateForm() {
            activeTemplate = null;
            renderList();

            document.getElementById('form-title').innerText = 'Create Template';
            document.getElementById('form-id').value = '';
            document.getElementById('form-name').value = '';
            document.getElementById('form-description').value = '';
            document.getElementById('form-content').value = '';

            switchViews('form');
        }

        function showEditForm() {
            if (!activeTemplate) return;

            document.getElementById('form-title').innerText = 'Edit Template';
            document.getElementById('form-id').value = activeTemplate.id;
            document.getElementById('form-name').value = activeTemplate.name;
            document.getElementById('form-description').value = activeTemplate.description || '';
            document.getElementById('form-content').value = activeTemplate.content;

            switchViews('form');
        }

        function cancelForm() {
            if (activeTemplate) {
                switchViews('detail');
            } else {
                switchViews('idle');
            }
        }

        function switchViews(view) {
            document.getElementById('detail-idle').classList.add('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('form-view').classList.add('hidden');

            if (view === 'detail') document.getElementById('detail-view').classList.remove('hidden');
            if (view === 'form') document.getElementById('form-view').classList.remove('hidden');
            if (view === 'idle') document.getElementById('detail-idle').classList.remove('hidden');
            lucide.createIcons();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('form-id').value;
            const payload = {
                name: document.getElementById('form-name').value,
                description: document.getElementById('form-description').value,
                content: document.getElementById('form-content').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/prompt-templates/${id}` : '/api/prompt-templates';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const savedTemplate = await res.json();

                await fetchTemplates(false);
                selectTemplate(savedTemplate.id);
            } catch (err) {
                console.error("Save failed", err);
                alert("Failed to save template.");
            }
        }

        async function deleteTemplate() {
            if (!activeTemplate || !confirm('Are you sure you want to delete this template?')) return;
            try {
                await fetch(`/api/prompt-templates/${activeTemplate.id}`, { method: 'DELETE' });
                activeTemplate = null;
                await fetchTemplates(false);
                cancelForm();
            } catch (err) {
                console.error("Delete failed", err);
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
</body>
</html>
